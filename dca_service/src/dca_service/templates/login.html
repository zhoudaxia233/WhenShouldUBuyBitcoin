<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DCA Service</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('dca_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', initialTheme);
        })();
    </script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .theme-toggle-btn {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            right: max(16px, env(safe-area-inset-right));
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            z-index: 20;
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .security-note {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
        .version-badge {
            position: fixed;
            right: 10px;
            bottom: 8px;
            z-index: 9999;
            font-size: 12px;
            color: #6c757d;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #d9dee3;
            border-radius: 999px;
            padding: 3px 10px;
        }

        @media (max-width: 576px) {
            .theme-toggle-btn {
                padding: 7px 12px;
                font-size: 12px;
            }
            .login-container {
                padding: 28px 22px;
                margin-top: 32px;
            }
        }
        @media (min-width: 992px) {
            .login-container {
                max-width: 420px;
            }
        }

        html[data-theme="dark"] body {
            background: linear-gradient(135deg, #0f172a 0%, #1f2937 100%);
            color: #e5e7eb;
        }
        html[data-theme="dark"] .theme-toggle-btn {
            border-color: rgba(148, 163, 184, 0.45);
            background: rgba(15, 23, 42, 0.65);
            color: #e5e7eb;
        }
        html[data-theme="dark"] .login-container {
            background: #111827;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        html[data-theme="dark"] .login-header h1,
        html[data-theme="dark"] .form-group label {
            color: #f3f4f6;
        }
        html[data-theme="dark"] .login-header p,
        html[data-theme="dark"] .security-note {
            color: #9ca3af;
            border-top-color: #374151;
        }
        html[data-theme="dark"] .form-group input {
            background: #0b1220;
            border-color: #334155;
            color: #e5e7eb;
        }
        html[data-theme="dark"] .form-group input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }
        html[data-theme="dark"] .error-message {
            background: #3b0f19;
            border-color: #7f1d1d;
            color: #fca5a5;
        }
        html[data-theme="dark"] .version-badge {
            color: #9ba7b7;
            background: rgba(17, 24, 39, 0.9);
            border-color: #374151;
        }
    </style>
</head>
<body>
    <button id="themeToggleBtn" type="button" class="theme-toggle-btn">Dark</button>
    <div class="login-container">
        <div class="login-header">
            <h1>DCA Service</h1>
            <p>Sign in to your account</p>
        </div>
        
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/api/auth/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    autocomplete="email"
                    autofocus
                >
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    autocomplete="current-password"
                >
            </div>
            
            <button type="submit" class="btn-login">
                Sign In
            </button>
        </form>
        
        <div class="security-note">
            🔒 Secure connection
        </div>
    </div>
    <div class="version-badge">
        v{{ app_version }}{% if app_commit_sha %} ({{ app_commit_sha[:7] }}){% endif %}
    </div>
    <script>
        const THEME_STORAGE_KEY = 'dca_theme';

        function updateThemeToggleButton(theme) {
            const btn = document.getElementById('themeToggleBtn');
            if (!btn) return;
            btn.textContent = theme === 'dark' ? 'Light' : 'Dark';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_STORAGE_KEY, theme);
            updateThemeToggleButton(theme);
        }

        (function initThemeToggle() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            updateThemeToggleButton(currentTheme);
            const themeBtn = document.getElementById('themeToggleBtn');
            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    applyTheme(theme);
                });
            }
        })();
    </script>
</body>
</html>
