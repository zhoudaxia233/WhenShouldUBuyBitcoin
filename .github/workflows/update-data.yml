name: Update BTC Data Daily

# Run every day at 00:30 UTC (after daily close)
on:
  # schedule:
  #   - cron: '30 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Install dependencies
        run: |
          poetry install --no-interaction
      
      - name: Update SSL certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          
      - name: Run data update
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONWARNINGS: ignore:Unverified HTTPS request
        run: |
          # Retry up to 3 times with exponential backoff
          max_attempts=3
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            
            if poetry run python main.py --strict-update; then
              echo "✓ Data update successful"
              exit 0
            else
              exit_code=$?
              echo "✗ Attempt $attempt failed with exit code $exit_code"
              
              if [ $attempt -lt $max_attempts ]; then
                sleep_time=$((attempt * 10))
                echo "Waiting ${sleep_time}s before retry..."
                sleep $sleep_time
              fi
            fi
            
            attempt=$((attempt + 1))
          done
          
          echo "✗ All attempts failed."
          exit 1
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/*.csv docs/data/*.json docs/charts/*.html dca_service/src/dca_service/data/wealth_distribution.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update BTC data and charts [skip ci]" && git push)
